train:
  run_name: qwen35_9b_commonsenseqa
  output_dir: outputs/qwen35_9b_commonsenseqa
  model_name_or_path: Qwen/Qwen3.5-9B
  model_family: qwen35
  task_name: commonsenseqa
  train_split: train
  eval_splits: [validation]
  enable_thinking: false
  use_official_system_prompt: false
  max_train_samples: 8000
  max_eval_samples: 1000
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  response_max_new_tokens: 8
  num_train_steps: 500
  learning_rate: 1.0e-5
  full_tune: false
lora:
  enabled: false
selector:
  enabled: false
  top_k: 8
  search_upper_half_only: true
rollouts:
  save_train_rollouts: false
  save_eval_rollouts: false
