train:
  run_name: qwen35_9b_boolq_full
  output_dir: outputs/qwen35_9b_boolq_full
  model_name_or_path: Qwen/Qwen3.5-9B
  model_family: qwen35
  task_name: boolq
  train_split: train
  eval_splits:
  - validation
  enable_thinking: false
  use_official_system_prompt: false
  max_train_samples: 5000
  max_eval_samples: 500
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  response_max_new_tokens: 8
  num_train_steps: 500
  learning_rate: 1.0e-05
  full_tune: true
  gradient_checkpointing: true
  save_every: 100
  eval_every: 100
  report_to: none
  prompt_max_length: 768
  weight_decay: 0.01
  warmup_ratio: 0.03
  bf16: true
lora:
  enabled: false
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
selector:
  enabled: false
  scorer: gate_grad
  top_k: 8
  select_every: 1
  search_upper_half_only: true
  active_only_optimizer_state: false
rollouts:
  save_train_rollouts: false
  save_eval_rollouts: false
  max_train_rollouts_per_save: 0
  max_eval_rollouts_per_save: 0
